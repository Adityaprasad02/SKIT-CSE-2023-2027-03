name: Overall Project Tests

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  overall-project-tests:

    name: Overall Project Tests
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==============================
      # Backend Tests
      # ==============================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Backend Tests
        working-directory: Backend/backend
        run: ./mvnw test


      # ==============================
      # ML Tests
      # ==============================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML Dependencies
        working-directory: ml-system
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==============================
      # ML - Parsing Tests
      # ==============================

      - name: Run ML Parsing Tests
        working-directory: ml-system
        run: |
          pytest resume/tests/parsing -v


      # ==============================
      # ML - Preprocessing Tests
      # ==============================

      - name: Run ML Preprocessing Tests
        working-directory: ml-system
        run: |
          pytest resume/tests/preprocessing -v