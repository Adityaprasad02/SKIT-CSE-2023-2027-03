spring:
  datasource:
      url: jdbc:h2:mem:testdb
      driver-class-name : org.h2.Driver
      username: sa
      password:

  jpa:
      hibernate:
        ddl-auto: create
      properties:
        hibernate:
          default_schema: public

  h2:
      console:
          enabled: true
          path: /h2-console
